<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlanta Muslim Jamaat</title>
<meta name="description" content="Daily prayer times, Jumu'ah, events, khutbah summaries, giving and community for the Atlanta Muslim Jamaat in Decatur, Georgia.">
<meta name="theme-color" content="#0E4D3A">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AMJ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta property="og:title" content="Atlanta Muslim Jamaat">
<meta property="og:description" content="Prayer times, Jumu'ah, events and community in Decatur, Georgia.">
<meta property="og:image" content="/icons/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Figtree:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
<style>
:root {
  /* Masjid palette from the logo: deep green, gold, white. Layout: app shell, sticky header, single content column, bottom tab bar on phones. */
  --bg: #F4F7F4;
  --surface: #FFFFFF;
  --surface-2: #EEF3EF;
  --ink: #13211A;
  --muted: #56675E;
  --line: #D8E2DB;
  --green: #0E4D3A;
  --green-ink: #0E4D3A;
  --green-soft: #E1EDE6;
  --gold: #C29A3D;
  --gold-ink: #7A5A12;
  --gold-soft: #F6EED9;
  --hero: #0D3B2C;
  --hero-2: #12503C;
  --hero-ink: #F3F7F2;
  --btn: #0E4D3A;
  --btn-ink: #FFFFFF;
  --ok: #1D7A4B;
  --ok-soft: #E2F2E8;
  --warn: #9A5B00;
  --warn-soft: #FBEFD9;
  --bad: #B3261E;
  --bad-soft: #FBE5E3;
  --shadow: 0 1px 2px rgba(10, 40, 28, .06), 0 6px 20px rgba(10, 40, 28, .06);
  --font-display: "Marcellus", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-arabic: "Amiri", "Noto Naskh Arabic", "Traditional Arabic", serif;
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #09140F; --surface: #10201A; --surface-2: #152922; --ink: #E7EFE9; --muted: #9DB0A6; --line: #22392F;
    --green: #3FA27B; --green-ink: #7FCDAA; --green-soft: #15332A; --gold: #D6B25C; --gold-ink: #E3C67E; --gold-soft: #2B2514;
    --hero: #0B2A20; --hero-2: #0F3A2C; --hero-ink: #EEF5F0; --btn: #2C8A65; --btn-ink: #FFFFFF;
    --ok: #5CC28C; --ok-soft: #13301F; --warn: #E0A64A; --warn-soft: #2E2410; --bad: #F0857D; --bad-soft: #3A1715;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #09140F; --surface: #10201A; --surface-2: #152922; --ink: #E7EFE9; --muted: #9DB0A6; --line: #22392F;
  --green: #3FA27B; --green-ink: #7FCDAA; --green-soft: #15332A; --gold: #D6B25C; --gold-ink: #E3C67E; --gold-soft: #2B2514;
  --hero: #0B2A20; --hero-2: #0F3A2C; --hero-ink: #EEF5F0; --btn: #2C8A65; --btn-ink: #FFFFFF;
  --ok: #5CC28C; --ok-soft: #13301F; --warn: #E0A64A; --warn-soft: #2E2410; --bad: #F0857D; --bad-soft: #3A1715;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.55 var(--font-body);
  -webkit-font-smoothing: antialiased;
  padding-bottom: 76px;
}
@media (min-width: 900px) { body { padding-bottom: 0; } }
img { max-width: 100%; display: block; }
a { color: var(--green-ink); text-underline-offset: 3px; }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 400; line-height: 1.15; margin: 0 0 .4em; text-wrap: balance; letter-spacing: .005em; }
h1 { font-size: clamp(30px, 6vw, 44px); }
h2 { font-size: clamp(24px, 4.4vw, 30px); }
h3 { font-size: 20px; }
h4 { font-family: var(--font-body); font-weight: 600; font-size: 15px; }
p { margin: 0 0 .8em; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.tiny { font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; }
.ar { font-family: var(--font-arabic); direction: rtl; font-size: 26px; line-height: 1.9; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Shell ---------- */
.preview-ribbon { background: var(--gold-soft); color: var(--gold-ink); font-size: 13px; padding: 6px 16px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; justify-content: center; }
.preview-ribbon label { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.preview-ribbon select { width: auto; padding: 4px 8px; border-radius: 999px; font: 600 13px var(--font-body); border-color: color-mix(in srgb, var(--gold) 50%, transparent); }
.ic { width: 1.15em; height: 1.15em; flex: none; }
.btn .ic { width: 18px; height: 18px; }
.split > *, .grid > *, .admin-shell > *, .stack > * { min-width: 0; }
.alert-bar { display: flex; gap: 10px; align-items: flex-start; padding: 10px 16px; font-size: 14.5px; }
.alert-bar.janazah { background: #1C2B25; color: #F1F5F2; }
.alert-bar.closure, .alert-bar.weather { background: var(--warn-soft); color: var(--warn); }
.alert-bar.info { background: var(--green-soft); color: var(--green-ink); }
.alert-bar strong { font-weight: 700; }
.alert-bar .x { margin-left: auto; background: none; border: 0; color: inherit; font-size: 20px; cursor: pointer; line-height: 1; }

header.top { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-inner { max-width: 1160px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); min-width: 0; }
.brand .mark { width: 40px; height: 40px; flex: none; border-radius: 10px; overflow: hidden; display: grid; place-items: center; }
.brand .mark img { width: 100%; height: 100%; object-fit: contain; }
.brand .name { font-family: var(--font-display); font-size: 19px; line-height: 1.05; }
.brand .name small { display: block; font-family: var(--font-body); font-size: 11.5px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-top: 3px; }
nav.main { display: none; gap: 4px; margin-left: auto; }
nav.main a { text-decoration: none; color: var(--ink); padding: 8px 11px; border-radius: 999px; font-weight: 500; font-size: 15px; }
nav.main a:hover { background: var(--surface-2); }
nav.main a.on { background: var(--green-soft); color: var(--green-ink); }
.top-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
@media (min-width: 900px) { nav.main { display: flex; } .top-actions { margin-left: 8px; } }
.icon-btn { width: 40px; height: 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; cursor: pointer; }
.icon-btn svg { width: 20px; height: 20px; }
.avatar { width: 34px; height: 34px; border-radius: 999px; background: var(--gold-soft); color: var(--gold-ink); display: grid; place-items: center; font-weight: 700; font-size: 14px; flex: none; }

/* Drawer */
.drawer-scrim { position: fixed; inset: 0; background: rgba(5, 20, 14, .45); z-index: 60; opacity: 0; pointer-events: none; transition: opacity .2s; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(360px, 88vw); background: var(--surface); z-index: 61; transform: translateX(100%); transition: transform .25s ease; overflow-y: auto; padding: 18px 18px 40px; box-shadow: var(--shadow); }
body.drawer-open .drawer-scrim { opacity: 1; pointer-events: auto; }
body.drawer-open .drawer { transform: none; }
.drawer h4 { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 18px 0 6px; }
.drawer a { display: flex; align-items: center; justify-content: space-between; padding: 10px 10px; border-radius: 10px; text-decoration: none; color: var(--ink); font-weight: 500; }
.drawer a:hover, .drawer a.on { background: var(--green-soft); color: var(--green-ink); }
.drawer .lock { font-size: 11.5px; color: var(--muted); font-weight: 500; }

/* Bottom tab bar (phones) */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
nav.tabs a { display: grid; justify-items: center; gap: 2px; text-decoration: none; color: var(--muted); font-size: 11.5px; font-weight: 600; padding: 4px 0; border-radius: 10px; }
nav.tabs a svg { width: 23px; height: 23px; }
nav.tabs a.on { color: var(--green-ink); }
@media (min-width: 900px) { nav.tabs { display: none; } }

main { max-width: 1160px; margin: 0 auto; padding: 20px 16px 48px; min-height: 60vh; }
.page-head { margin: 8px 0 20px; }
.page-head .eyebrow { font-size: 12.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold-ink); font-weight: 700; margin-bottom: 6px; }
.page-head p { color: var(--muted); max-width: 62ch; }
.crumbs { font-size: 14px; margin-bottom: 10px; }
.crumbs a { text-decoration: none; }

/* ---------- Components ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.card.pad-lg { padding: 22px; }
.card h3 { margin-bottom: 6px; }
.stack { display: grid; gap: 16px; }
.stack-sm { display: grid; gap: 10px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: 1fr; }
.g3 { grid-template-columns: 1fr; }
.g4 { grid-template-columns: repeat(2, 1fr); }
@media (min-width: 700px) { .g2 { grid-template-columns: 1fr 1fr; } .g3 { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1000px) { .g3 { grid-template-columns: repeat(3, 1fr); } .g4 { grid-template-columns: repeat(4, 1fr); } }
.split { display: grid; gap: 20px; }
@media (min-width: 960px) { .split { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); align-items: start; } }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: 999px; border: 1px solid transparent; background: var(--btn); color: var(--btn-ink); font: 600 15px/1.2 var(--font-body); text-decoration: none; cursor: pointer; }
.btn:hover { filter: brightness(1.08); }
.btn.gold { background: var(--gold); color: #1F1704; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { background: var(--surface-2); filter: none; }
.btn.light { background: rgba(255,255,255,.12); color: var(--hero-ink); border-color: rgba(255,255,255,.25); }
.btn.danger { background: var(--bad); color: #fff; }
.btn.sm { min-height: 34px; padding: 6px 12px; font-size: 13.5px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.link-btn { background: none; border: 0; padding: 0; color: var(--green-ink); font: inherit; font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.chip.green { background: var(--green-soft); color: var(--green-ink); border-color: transparent; }
.chip.gold { background: var(--gold-soft); color: var(--gold-ink); border-color: transparent; }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
.filter-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; scrollbar-width: none; }
.filter-row button { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 7px 14px; font: 600 14px var(--font-body); cursor: pointer; }
.filter-row button.on { background: var(--green); border-color: var(--green); color: #fff; }

label.f { display: grid; gap: 6px; font-weight: 600; font-size: 14px; }
label.f .hint { font-weight: 400; color: var(--muted); font-size: 13px; }
input, select, textarea { font: 16px var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; }
textarea { min-height: 110px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--green); outline-offset: 0; border-color: transparent; }
.check { display: flex; gap: 10px; align-items: flex-start; font-weight: 500; font-size: 15px; }
.check input { width: 20px; height: 20px; margin-top: 2px; flex: none; accent-color: var(--green); }
.form-grid { display: grid; gap: 14px; }
@media (min-width: 640px) { .form-grid.two { grid-template-columns: 1fr 1fr; } .form-grid .full { grid-column: 1 / -1; } }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 7px 14px; border-radius: 999px; font: 600 14px var(--font-body); color: var(--muted); cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; background: var(--surface-2); }
tr:last-child td { border-bottom: 0; }
tr.today td { background: var(--gold-soft); font-weight: 600; }
td.wrap { white-space: normal; min-width: 220px; }

.list-item { display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; }
.list-item:last-child { border-bottom: 0; }
.list-item:hover h4, .list-item:hover h3 { color: var(--green-ink); }
.date-tile { flex: none; width: 54px; text-align: center; border-radius: 12px; background: var(--green-soft); color: var(--green-ink); padding: 6px 0; line-height: 1.1; }
.date-tile b { display: block; font-family: var(--font-display); font-size: 22px; font-weight: 400; }
.date-tile span { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }

.empty { text-align: center; padding: 28px 16px; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); }
.notice { display: flex; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--gold-soft); color: var(--gold-ink); font-size: 14.5px; }
.notice.green { background: var(--green-soft); color: var(--green-ink); }
.gate { text-align: center; padding: 36px 20px; }
.gate .lock-ico { width: 54px; height: 54px; margin: 0 auto 12px; border-radius: 999px; background: var(--gold-soft); color: var(--gold-ink); display: grid; place-items: center; }

/* ---------- Hero / prayer clock ---------- */
.hero { position: relative; overflow: hidden; border-radius: 20px; color: var(--hero-ink); background: radial-gradient(120% 90% at 85% 0%, var(--hero-2), var(--hero) 60%); padding: 22px 18px 18px; isolation: isolate; }
.hero canvas.pattern { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; opacity: .11; }
.hero .date-line { font-size: 14px; color: color-mix(in srgb, var(--hero-ink) 78%, transparent); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.hero .date-line .hijri { color: var(--gold); }
.hero .next { margin: 14px 0 4px; }
.hero .next .label { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.hero .next .big { font-family: var(--font-display); font-size: clamp(44px, 12vw, 72px); line-height: 1; margin: 6px 0 2px; }
.hero .next .big .t { color: var(--gold); }
.hero .next .sub { font-size: 15.5px; color: color-mix(in srgb, var(--hero-ink) 85%, transparent); }
.arc-wrap { margin: 10px -4px 4px; }
.arc-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }
.times { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
@media (min-width: 640px) { .times { grid-template-columns: repeat(6, 1fr); } }
.time { background: color-mix(in srgb, var(--hero) 82%, #ffffff 6%); border: 1px solid rgba(255,255,255,.12); border-radius: 12px; padding: 9px 10px; }
.time .n { font-size: 12.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: color-mix(in srgb, var(--hero-ink) 70%, transparent); }
.time .a { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.time .i { font-size: 12.5px; color: var(--gold); font-variant-numeric: tabular-nums; }
.time.next-on { background: var(--gold); border-color: var(--gold); color: #1B1405; }
.time.next-on .n, .time.next-on .i { color: #3A2A06; }
.time.past .a, .time.past .n { opacity: .6; }
.hero .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
@media (min-width: 900px) {
  .hero.home { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); grid-template-areas: "date arc" "next arc" "acts arc" "times times"; column-gap: 40px; padding: 28px 30px 24px; }
  .hero.home .date-line { grid-area: date; } .hero.home .next { grid-area: next; } .hero.home .arc-wrap { grid-area: arc; align-self: center; margin: 0; }
  .hero.home .times { grid-area: times; margin-top: 18px; } .hero.home .actions { grid-area: acts; align-self: start; }
}

.quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (min-width: 700px) { .quick { grid-template-columns: repeat(6, 1fr); } }
.quick a { display: grid; justify-items: center; gap: 6px; text-align: center; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 6px; font-size: 13.5px; font-weight: 600; }
.quick a:hover { border-color: var(--green); }
.quick .qi { width: 38px; height: 38px; border-radius: 12px; background: var(--green-soft); color: var(--green-ink); display: grid; place-items: center; }
.quick .qi svg { width: 21px; height: 21px; }

.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 28px 0 12px; }
.section-title h2 { margin: 0; }
.section-title a { font-weight: 600; font-size: 14.5px; text-decoration: none; }

.jumuah-card { display: grid; gap: 12px; background: var(--gold-soft); border: 1px solid color-mix(in srgb, var(--gold) 35%, transparent); border-radius: var(--radius); padding: 18px; }
.jumuah-card .slots { display: flex; gap: 10px; flex-wrap: wrap; }
.slot { background: var(--surface); border-radius: 12px; padding: 10px 14px; min-width: 130px; }
.slot .k { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.slot .v { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---------- Learn ---------- */
.guide-card { display: grid; gap: 8px; text-decoration: none; color: inherit; }
.guide-card .gi { width: 44px; height: 44px; border-radius: 12px; background: var(--gold-soft); color: var(--gold-ink); display: grid; place-items: center; font-family: var(--font-display); font-size: 20px; }
.guide-card:hover h3 { color: var(--green-ink); }
.steps { counter-reset: step; display: grid; gap: 14px; padding: 0; margin: 0; list-style: none; }
.steps > li { counter-increment: step; position: relative; padding-left: 52px; }
.steps > li::before { content: counter(step); position: absolute; left: 0; top: 0; width: 36px; height: 36px; border-radius: 999px; background: var(--green); color: #fff; display: grid; place-items: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.posture { display: grid; grid-template-columns: 92px 1fr; gap: 16px; align-items: start; }
.posture svg { width: 92px; height: 92px; background: var(--green-soft); color: var(--green-ink); border-radius: 16px; padding: 6px; }
@media (max-width: 420px) { .posture { grid-template-columns: 1fr; } .posture svg { width: 80px; height: 80px; } }
.recite { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-top: 10px; }
